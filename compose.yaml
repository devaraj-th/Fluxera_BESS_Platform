services:
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_DB: fluxera
      POSTGRES_USER: fluxera
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxera -d fluxera"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-too
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      FLUXERA_DATABASE_URL: postgresql+psycopg://fluxera:change-me@postgres:5432/fluxera
      FLUXERA_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]
  web:
    build:
      context: apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["3000:3000"]
