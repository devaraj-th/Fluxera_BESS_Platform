[project]
name = "fluxera-bess-platform"
version = "0.1.0"
description = "Fluxera BESS Procurement Assurance Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic==2.11.3",
  "pydantic-settings==2.9.1",
  "sqlalchemy==2.0.40",
  "psycopg[binary]==3.2.6",
  "alembic==1.15.2",
  "python-multipart==0.0.20",
  "pypdf==5.4.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.5",
  "mypy==1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
per-file-ignores = { "apps/api/main.py" = ["B008"], "alembic/*.py" = ["E501", "I001"] }

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["apps.api", "packages.domain"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]
